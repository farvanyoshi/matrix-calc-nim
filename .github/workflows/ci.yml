name: Nim library
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nim: ['2.0.8', '2.2.12']
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
      - run: nimble test -y
      - run: nimble testRelease -y
      - run: nimble testArc -y
      - run: nimble testGuards -y
      - run: nimble docs -y
      - run: nim c --path:src --nimcache:.tools/nimcache/cli --out:.tools/matrix_calc src/matrix_calc_cli.nim
      - run: printf 'A = Matrix.random(3,3)\nshape(A)\nquit\n' | .tools/matrix_calc
